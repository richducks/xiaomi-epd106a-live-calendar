name: Android and offline acceptance
on:
  push:
  pull_request:
jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android toolchain
        run: |
          # Ubuntu exports ANDROID_HOME; SDK manager exists but may not be in PATH.
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER" || { echo "Missing Android SDK manager" >&2; exit 1; }
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Offline unit and guard tests
        run: python3 -m unittest discover -s tests -v
      - name: Android builds
        run: |
          bash build.sh
          bash build-xposed.sh
      - name: Source shell and JavaScript checks
        run: |
          for file in scripts/*.sh recovery/*.sh; do sh -n "$file"; done
          node --check web/app.js
      - name: Publish workflow APK artifacts (not firmware)
        uses: actions/upload-artifact@v4
        with:
          name: EPD106A-application-and-hook
          path: |
            build/output/eink-calendar-test.apk
            build/output/eink-livecalendar-policy.apk
          if-no-files-found: error
