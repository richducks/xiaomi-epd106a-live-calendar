name: Build and publish downloadable Xiaomi Reader toolkits

on:
  pull_request:
    paths:
      - 'tools/ai-offline-kit/**'
      - '.github/workflows/publish-ai-offline-kit.yml'
      - 'docs/DOWNLOAD_AND_INSTALL.md'
  push:
    branches: [main]
    paths:
      - 'tools/ai-offline-kit/packaging/release.json'
      - '.github/workflows/publish-ai-offline-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15-intel
            target: macos-x64
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/ai-offline-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux Tk dependencies
        if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libtk8.6 libtcl8.6
      - name: Unit tests (safe / no connected devices)
        run: python -m unittest discover -s tests -v
      - name: Distribution rules tests
        run: python -m unittest discover -s packaging -p 'test_*.py' -v
      - name: Build self-contained desktop GUI
        run: python -m pip install --disable-pip-version-check pyinstaller==6.22.3
      - name: Freeze GUI (no Python required on target)
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name XiaomiReader desktop_gui.py
      - name: Freeze AI CLI
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name XiaomiReaderAI ai_runner.py
      - name: Validate packaged executables
        run: python packaging/verify_desktop.py --target ${{ matrix.target }}
      - name: Archive platform software
        run: python packaging/package_desktop.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: pc-${{ matrix.target }}
          path: tools/ai-offline-kit/release-output/*.zip
          if-no-files-found: error
          retention-days: 30

  historical-first-party-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download pinned first-party historical APK assets
        run: python tools/ai-offline-kit/packaging/make_historical_apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: first-party-apks
          path: tools/ai-offline-kit/release-output/EPD106A-first-party-APKs-2026-10-11.zip
          if-no-files-found: error
          retention-days: 30

  github-release:
    if: github.event_name != 'pull_request'
    needs: [build-pc, historical-first-party-apks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Compute checksums for public assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test "$(find . -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 5
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish versioned GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$(python -c 'import json; print(json.load(open("tools/ai-offline-kit/packaging/release.json", encoding="utf-8"))["tag"])')"
          RELEASE_TITLE="$(python -c 'import json; print(json.load(open("tools/ai-offline-kit/packaging/release.json", encoding="utf-8"))["name"])')"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version already released: $RELEASE_TAG; do not silently replace files." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file tools/ai-offline-kit/packaging/RELEASE_NOTES.md \
            --prerelease
